# Local development environment for the whole project: scraping, analysis
# and the BigQuery upload.

name: fintech-app-reviews
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pandas>=2.2
  - requests
  - matplotlib
  - ipykernel
  - jupyterlab
  - pip:
    # Collection and analysis pipeline
    - google-play-scraper
    - app-store-scraper
    - vaderSentiment
    - google-cloud-bigquery
    - google-cloud-secret-manager
